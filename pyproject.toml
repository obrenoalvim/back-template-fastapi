[project]
name = "back-template-fastapi"
version = "0.1.0"
description = "FastAPI backend template: JWT auth, async SQLAlchemy + Alembic, rate limiting, structured logging, Docker"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.139.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008", # FastAPI's `Depends(...)` as a default arg is the documented pattern, not a bug
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One shared event loop for the whole session — the SQLAlchemy async engine is a
# module-level singleton bound to whatever loop was running when it was created;
# pytest-asyncio's default per-test loop would break its pooled connections.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
